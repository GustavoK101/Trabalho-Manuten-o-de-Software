<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Socket.IO chat</title>
  <style>
      body { margin: 0; padding-bottom: 3rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

      #form { background: rgba(0, 0, 0, 0.15); padding: 0.25rem; position: fixed; bottom: 0; left: 0; right: 0; display: flex; align-items: center; min-height: 3rem; box-sizing: border-box; backdrop-filter: blur(10px); }
      #input { border: none; padding: 0.5rem 1rem; flex-grow: 1; border-radius: 1rem; margin: 0.25rem; resize: none; font-family: inherit; font-size: 1rem; line-height: 1.4; max-height: 8rem; overflow-y: auto; }
      #input:focus { outline: none; }
      #form > button { background: #333; border: none; padding: 0 1rem; margin: 0.25rem; border-radius: 3px; outline: none; color: #fff; height: 2.5rem; }
      #char-count { font-size: 0.72rem; color: #888; padding: 0 0.4rem; white-space: nowrap; }
      #char-count.warn { color: #e07b00; }
      #char-count.danger { color: #c0392b; }

      #messages { list-style-type: none; margin: 0; padding: 0; }
      #messages > li { padding: 0.5rem 1rem; }
      #messages > li:nth-child(odd) { background: #efefef; }
      .username { font-weight: bold; margin-right: 0.4rem; }
      .timestamp { font-size: 0.72rem; color: #aaa; margin-left: 0.5rem; }
      #typing { padding: 0.25rem 1rem; font-size: 0.8rem; color: #888; min-height: 1.2rem; }
      #user-count { padding: 0.4rem 1rem; font-size: 0.8rem; color: #555; background: #f5f5f5; border-bottom: 1px solid #ddd; }
      .system-msg { text-align: center; font-size: 0.78rem; color: #999; font-style: italic; padding: 0.3rem 0; }
  </style>
</head>
<body>
  <div id="user-count"></div>
  <ul id="messages"></ul>
  <div id="typing"></div>
  <form id="form" action="">
    <textarea id="input" autocomplete="off" placeholder="Mensagem... (Enter para enviar, Shift+Enter para nova linha)" rows="1"></textarea>
    <span id="char-count">500</span>
    <button type="submit">Enviar</button>
  </form>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    let counter = 0;

    const username = (prompt('Seu nome:') || 'Anônimo').trim().slice(0, 30);

    const socket = io({
      auth: {
        serverOffset: 0,
        username
      },
      ackTimeout: 10000,
      retries: 3,
    });

    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const messages = document.getElementById('messages');
    const typingEl = document.getElementById('typing');
    const userCountEl = document.getElementById('user-count');
    const charCountEl = document.getElementById('char-count');

    const MAX = 500;

    function updateCharCount() {
      const remaining = MAX - input.value.length;
      charCountEl.textContent = remaining;
      charCountEl.className = remaining < 0 ? 'danger' : remaining < 100 ? 'warn' : '';
    }

    function autoResize() {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 128) + 'px';
    }

    function sendMessage() {
      const msg = input.value;
      if (msg.trim()) {
        clearTimeout(typingTimeout);
        socket.emit('stop typing');
        const clientOffset = `${socket.id}-${counter++}`;
        socket.emit('chat message', msg, clientOffset);
        input.value = '';
        updateCharCount();
        autoResize();
      }
    }

    socket.on('system message', (text) => {
      const item = document.createElement('li');
      item.className = 'system-msg';
      item.textContent = text;
      messages.appendChild(item);
      window.scrollTo(0, document.body.scrollHeight);
    });

    socket.on('user count', (count) => {
      userCountEl.textContent = count === 1 ? '1 usuário online' : `${count} usuários online`;
    });

    let typingTimeout;
    input.addEventListener('input', () => {
      updateCharCount();
      autoResize();
      socket.emit('typing');
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => socket.emit('stop typing'), 2000);
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      sendMessage();
    });

    const typingUsers = new Set();
    socket.on('typing', (user) => {
      typingUsers.add(user);
      typingEl.textContent = [...typingUsers].join(', ') + ' está digitando...';
    });
    socket.on('stop typing', (user) => {
      typingUsers.delete(user);
      typingEl.textContent = typingUsers.size ? [...typingUsers].join(', ') + ' está digitando...' : '';
    });

    socket.on('chat message', (user, msg, serverOffset, createdAt) => {
      const item = document.createElement('li');
      const name = document.createElement('span');
      name.className = 'username';
      name.textContent = user + ':';
      item.appendChild(name);
      item.appendChild(document.createTextNode(msg));
      if (createdAt) {
        const ts = document.createElement('span');
        ts.className = 'timestamp';
        ts.textContent = new Date(createdAt).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        item.appendChild(ts);
      }
      messages.appendChild(item);
      window.scrollTo(0, document.body.scrollHeight);
      socket.auth.serverOffset = serverOffset;
    });
  </script>
</body>
</html>
